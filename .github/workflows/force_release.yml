name: Force Release

permissions: {}

on:
  workflow_dispatch:
    inputs:
      specifier:
        description: Version bump to force for all packages
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  force-release:
    name: Force release all packages
    permissions:
      id-token: write
      contents: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: yarn

      - name: Install packages
        run: |
          yarn --immutable

      - name: Force release with Nx
        env:
          GIT_AUTHOR_NAME: Florian Imdahl
          GIT_AUTHOR_EMAIL: ffflorian@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
          export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"
          git config --global "user.email" "${GIT_AUTHOR_EMAIL}"
          git config --global "user.name" "${GIT_AUTHOR_NAME}"
          set -o pipefail
          yarn nx release "${{ inputs.specifier }}" --yes 2>&1 | tee /tmp/release.log

      - name: Upload release log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: force-release-log
          path: /tmp/release.log
